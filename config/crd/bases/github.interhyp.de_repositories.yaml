---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: repositories.github.interhyp.de
spec:
  group: github.interhyp.de
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Repository is the Schema for the repositories API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Repository
            properties:
              about:
                description: About contains descriptive information about the repository.
                properties:
                  description:
                    description: Description is a short description of the repository
                      displayed on the repository page.
                    maxLength: 1000
                    type: string
                  topics:
                    description: |-
                      Topics is a list of topics (tags) that categorize and help discover the repository.
                      Topics appear on the repository page and in GitHub's topic explorer.
                      See: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/classifying-your-repository-with-topics
                    items:
                      description: |-
                        Topic represents a repository topic (tag) for categorization.
                        See: https://docs.github.com/en/rest/repos/repos#replace-all-repository-topics
                      properties:
                        name:
                          description: |-
                            Name is the topic name.
                            Topics must be lowercase and can contain letters, numbers, and hyphens.
                            They must start with a letter or number.
                          maxLength: 50
                          pattern: ^[a-z0-9][a-z0-9-]{0,49}$
                          type: string
                      type: object
                    type: array
                  website:
                    description: |-
                      Website is the URL of the repository's homepage or documentation.
                      Must be a valid HTTP or HTTPS URL.
                    maxLength: 200
                    pattern: ^https?://[^\s]+$
                    type: string
                type: object
              accessLevelForExternalWorkflows:
                default: none
                description: |-
                  AccessLevelForExternalWorkflows controls access to workflows outside the repository.
                  - "none": Only workflows in this repository can access actions and reusable workflows
                  - "user": Workflows in user-owned private repositories can access them
                  - "organization": Workflows across the organization can access them
                  - "enterprise": Workflows across the enterprise can access them
                  See: https://docs.github.com/en/rest/actions/permissions
                enum:
                - none
                - user
                - organization
                - enterprise
                type: string
              actionsEnabled:
                default: true
                description: |-
                  ActionsEnabled determines whether this repository can use GitHub Actions.
                  This must be enabled at the organization level for this setting to take effect.
                  See: https://docs.github.com/en/rest/actions/permissions
                type: boolean
              allowedMergeStrategies:
                default:
                - type: merge
                - type: rebase
                description: |-
                  AllowedMergeStrategies lists the merge strategies allowed for pull requests.
                  See: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges
                items:
                  description: |-
                    MergeStrategy defines an allowed merge strategy for pull requests.
                    See: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/about-merge-methods-on-github
                  properties:
                    type:
                      description: |-
                        Type specifies the merge strategy type.
                        - "merge": Create a merge commit (preserves all commits from the feature branch)
                        - "rebase": Rebase and merge (rebases commits onto base branch)
                        - "squash": Squash and merge (combines all commits into a single commit)
                      enum:
                      - merge
                      - rebase
                      - squash
                      type: string
                  type: object
                type: array
              archived:
                default: false
                description: |-
                  Archived marks the repository as archived (read-only).
                  Archived repositories cannot receive new issues, pull requests, or commits.
                  See: https://docs.github.com/en/repositories/archiving-a-github-repository/archiving-repositories
                type: boolean
              attachedCodeSecurityConfiguration:
                description: |-
                  AttachedCodeSecurityConfiguration references a CodeSecurityConfiguration to attach to this repository.
                  This is only used when the organization's configuration has "selected" attachment scope.
                  See: https://docs.github.com/en/rest/code-security/configurations
                properties:
                  name:
                    description: Name is the name of the referenced CodeSecurityConfiguration
                      CRD.
                    type: string
                required:
                - name
                type: object
              autolinks:
                description: |-
                  Autolinks defines autolinks inline, without the need for a separate AutolinksPreset CRD.
                  The operator reconciles the union of inline autolinks and the autolinks referenced via AutolinksPresetList.
                  An autolink is identified by its keyPrefix. If several definitions share the same keyPrefix, identical
                  definitions are applied once (a warning is logged), while differing definitions are treated as a conflict:
                  no autolinks are changed on GitHub and the AutolinksSynced condition is set to False.
                  At most 25 inline autolinks are allowed.
                items:
                  description: |-
                    Autolink defines an automatic link reference for external resources.
                    When a reference matching KeyPrefix is found in issues, pull requests, or commit messages,
                    GitHub automatically converts it to a clickable link using the URLTemplate.
                    See: https://docs.github.com/en/rest/repos/autolinks
                  properties:
                    isAlphanumeric:
                      default: false
                      description: |-
                        IsAlphanumeric determines whether the reference must be alphanumeric.
                        - true: the <num> parameter of the url_template matches alphanumeric characters `A-Z` (case insensitive), `0-9`, and `-`
                        - false: reference only matches numeric characters.
                      type: boolean
                    keyPrefix:
                      description: |-
                        KeyPrefix is the text prefix that triggers autolink creation.
                        When text starts with this prefix followed by a reference, it becomes a link.
                        Examples: "JIRA-", "TICKET-", "BUG-"
                      maxLength: 20
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{0,19}$
                      type: string
                    urlTemplate:
                      description: |-
                        URLTemplate is the URL pattern used to generate links.
                        Use <num> as a placeholder for the reference number/ID.
                        Example: "https://jira.example.com/browse/<num>" converts "JIRA-123" to "https://jira.example.com/browse/123"
                      maxLength: 200
                      type: string
                  required:
                  - isAlphanumeric
                  - keyPrefix
                  - urlTemplate
                  type: object
                maxItems: 25
                type: array
                x-kubernetes-validations:
                - message: autolink keyPrefixes must be unique
                  rule: self.all(x, self.filter(y, y.keyPrefix == x.keyPrefix).size()
                    <= 1)
              autolinksPresets:
                description: |-
                  AutolinksPresetList references AutolinksPreset CRDs to create autolinks for this repository.
                  Autolinks automatically convert references (like "JIRA-123") into clickable links.
                  See: https://docs.github.com/en/rest/repos/autolinks
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              availableActionsRunnerGroups:
                description: |-
                  AvailableActionsRunnerGroups lists runner group names that this repository can use.
                  This is only relevant when the organization's runner groups have "selected" visibility.
                  See: https://docs.github.com/en/rest/actions/self-hosted-runner-groups
                items:
                  type: string
                type: array
              customProperties:
                description: |-
                  CustomProperties is a list of custom property values to apply to this repository.
                  These properties must be defined in the parent organization's custom properties.
                  If a property is not present in this list, it will be unset (removed) from the repository.
                  See: https://docs.github.com/en/rest/repos/custom-properties
                items:
                  description: |-
                    CustomPropertyValue defines a custom property value for a repository.
                    Custom properties are defined at the organization level and applied to repositories.
                    If both Value and Values are empty, the value for the property is considered nil (removes the property).
                    For custom properties of value type "multi_select", use Values to specify multiple selections.
                    For all other value types ("string", "single_select", "true_false"), use Value.
                    See: https://docs.github.com/en/rest/repos/custom-properties
                  properties:
                    propertyName:
                      description: PropertyName is the name of the custom property
                        as defined in the organization.
                      type: string
                    value:
                      description: |-
                        Value is the property value for types "string", "single_select", and "true_false".
                        For "true_false", must be "true" or "false".
                        For "single_select", must be one of the allowed values defined in the organization's custom property.
                      type: string
                    values:
                      description: |-
                        Values is the list of selected values for "multi_select" type properties.
                        Each value must be one of the allowed values defined in the organization's custom property.
                      items:
                        type: string
                      type: array
                  required:
                  - propertyName
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of the fields in [value values] must be set
                    rule: (has(self.value)?1:0)+(has(self.values)?1:0) == 1
                type: array
              defaultBranch:
                default: main
                description: |-
                  DefaultBranch is the name of the default branch for the repository.
                  This is the base branch for pull requests and where the repository opens by default.
                maxLength: 100
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,99}$
                type: string
              deleteBranchOnMerge:
                default: true
                description: |-
                  DeleteBranchOnMerge automatically deletes head branches after pull requests are merged.
                  This helps keep the repository clean by removing merged feature branches.
                  See: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-the-automatic-deletion-of-branches
                type: boolean
              deployKeys:
                description: |-
                  DeployKeyList defines deploy keys to create for this repository.
                  Deploy keys are SSH keys that grant access to a single repository.
                  See: https://docs.github.com/en/rest/deploy-keys/deploy-keys
                items:
                  description: |-
                    DeployKey defines an SSH key for read-only or read-write access to a single repository.
                    Deploy keys are commonly used for CI/CD systems and automated deployments.
                    See: https://docs.github.com/en/rest/deploy-keys/deploy-keys
                  properties:
                    key:
                      description: |-
                        Key is the public SSH key in OpenSSH format.
                        Supported key types are RSA and Ed25519.
                        Example: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC..." or "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5..."
                      pattern: ^ssh-(rsa|ed25519) [A-Za-z0-9+/]+={0,3}( [^\s]+)?$
                      type: string
                    readOnly:
                      default: true
                      description: |-
                        ReadOnly determines the access level for this deploy key.
                        - true: Key can only read from the repository (cannot push)
                        - false: Key can read and write to the repository (can push commits)
                      type: boolean
                    title:
                      description: |-
                        Title is a descriptive name for the deploy key shown in the repository settings.
                        Examples: "CI/CD Key", "Read-Only Deploy Key", "Production Server"
                      type: string
                  required:
                  - key
                  - title
                  type: object
                type: array
              hasDownloads:
                default: false
                description: |-
                  HasDownloads enables or disables the Downloads feature for the repository.
                  This feature is deprecated and has been replaced by Releases.
                type: boolean
              hasIssues:
                default: true
                description: |-
                  HasIssues enables or disables the GitHub Issues feature for the repository.
                  When enabled, users can create and track issues.
                type: boolean
              hasProjects:
                default: false
                description: |-
                  HasProjects enables or disables the GitHub Projects (classic) feature for the repository.
                  Note: This refers to classic projects, not the newer Projects feature.
                type: boolean
              hasWiki:
                default: false
                description: |-
                  HasWiki enables or disables the GitHub Wiki feature for the repository.
                  When enabled, users can create wiki pages for documentation.
                type: boolean
              isTemplate:
                default: false
                description: |-
                  IsTemplate marks the repository as a template repository.
                  Template repositories can be used as a starting point for new repositories.
                  See: https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-template-repository
                type: boolean
              mergeCommitMessage:
                default: PR_TITLE
                description: |-
                  MergeCommitMessage determines the default message for merge commits.
                  - "PR_BODY": Use the pull request body
                  - "PR_TITLE": Use the pull request title
                  - "BLANK": Use a blank message
                  See: https://docs.github.com/en/rest/repos/repos#update-a-repository
                enum:
                - PR_BODY
                - PR_TITLE
                - BLANK
                type: string
              mergeCommitTitle:
                default: MERGE_MESSAGE
                description: |-
                  MergeCommitTitle determines the default title for merge commits.
                  - "PR_TITLE": Use the pull request title
                  - "MERGE_MESSAGE": Use the default merge message format
                  See: https://docs.github.com/en/rest/repos/repos#update-a-repository
                enum:
                - PR_TITLE
                - MERGE_MESSAGE
                type: string
              name:
                description: |-
                  Name is the GitHub repository name.
                  Repository names can contain alphanumeric characters, hyphens, underscores, and periods.
                maxLength: 100
                minLength: 1
                pattern: ^[.a-zA-Z0-9][a-zA-Z0-9_.-]{0,99}$
                type: string
              organizationRef:
                description: OrganizationRef references the Organization CRD this
                  repository belongs to.
                properties:
                  name:
                    description: Name is the name of the referenced Organization CRD.
                    type: string
                type: object
              rulesetPresets:
                description: |-
                  RulesetPresetList references RulesetPreset CRDs to apply to this repository.
                  These define branch protection rules, required status checks, and other policies.
                  See: https://docs.github.com/en/rest/repos/rules
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              rulesets:
                description: |-
                  Rulesets defines repository rulesets inline, without the need for a separate RulesetPreset CRD.
                  Inline rulesets support exactly the same fields as a RulesetPreset.
                  The operator reconciles the union of inline rulesets and the rulesets referenced via RulesetPresetList.
                  If an inline ruleset and a referenced RulesetPreset (or two referenced RulesetPresets) share the same name,
                  identical definitions are applied once (a warning is logged), while differing definitions are treated as a
                  conflict: no rulesets are changed on GitHub and the RulesetsSynced condition is set to False.
                  At most 10 inline rulesets are allowed; larger or shared sets of rules belong in RulesetPresets.
                  The target 'repository' is only supported at organization level; inline rulesets with target 'repository'
                  are filtered out (i.e. are not checked nor applied), the same as for RulesetPresets.
                items:
                  description: |-
                    RulesetSpec defines a ruleset. It is the spec of a RulesetPreset and the element type of inline rulesets
                    in Organization.spec.rulesets and Repository.spec.rulesets.
                    A ruleset preset defines reusable repository rules that can be applied to multiple repositories
                    or organizations. Rulesets enforce policies like branch protection, required reviews, and more.
                    See: https://docs.github.com/en/rest/repos/rules
                  properties:
                    bypassActors:
                      description: |-
                        BypassActors defines actors (users, teams, apps) who can bypass this ruleset.
                        Bypass actors can perform operations that would otherwise be blocked by the ruleset.
                        See: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets#about-bypass-mode-for-rulesets
                      items:
                        description: |-
                          RulesetBypassActor defines an actor (user, team, or integration) who can bypass ruleset enforcement.
                          Either ActorID (for direct specification) or ActorSlug (for name-based resolution) must be provided for
                          ActorTypes "Integration" and "Team". ActorID must be provided for ActorType "RepositoryRole".
                          Both must be empty for ActorType "DeployKey".
                          See: https://docs.github.com/en/rest/repos/rules#create-an-organization-repository-ruleset
                        properties:
                          actorId:
                            description: |-
                              ActorID is the numeric ID of the bypass actor.
                              This field is mutually exclusive with ActorSlug.
                            format: int64
                            type: integer
                          actorSlug:
                            description: |-
                              ActorSlug is the slug or name of the actor, which will be resolved to an ID.
                              This field is mutually exclusive with ActorID.
                              Only supported for ActorType "Integration" (GitHub Apps) and "Team" (organization teams).
                              For Integration, use the app slug (e.g., "my-github-app").
                              For Team, use the team slug (e.g., "platform-engineers").
                            type: string
                          actorType:
                            description: |-
                              ActorType specifies the type of actor that can bypass the ruleset.
                              - "Integration": A GitHub App
                              - "OrganizationAdmin": Organization administrators
                              - "RepositoryRole": Users with a specific repository role
                              - "Team": An organization team
                              - "DeployKey": A deploy key
                              - "EnterpriseOwner": Enterprise owners (GitHub Enterprise only)
                            enum:
                            - Integration
                            - OrganizationAdmin
                            - RepositoryRole
                            - Team
                            - DeployKey
                            - EnterpriseOwner
                            type: string
                          bypassMode:
                            description: |-
                              BypassMode determines when and how the actor can bypass the ruleset.
                              - "always": Actor can always bypass the ruleset
                              - "pull_request": Actor can bypass only when submitting via pull request
                            enum:
                            - always
                            - pull_request
                            type: string
                        required:
                        - actorType
                        type: object
                        x-kubernetes-validations:
                        - message: at most one of the fields in [actorId actorSlug]
                            may be set
                          rule: (has(self.actorId)?1:0)+(has(self.actorSlug)?1:0)
                            <= 1
                      maxItems: 100
                      type: array
                    conditions:
                      description: |-
                        Conditions defines which refs are included or excluded in the list of targets for this Ruleset.
                        They also define which Repositories are targeted by Organization-level Rulesets.
                      properties:
                        refName:
                          description: RefName defines which git refs (branches or
                            tags) a ruleset applies to.
                          minProperties: 1
                          properties:
                            exclude:
                              description: |-
                                Exclude defines ref patterns to exempt from the ruleset.
                                Refs matching exclude patterns will not be subject to the ruleset rules.
                                Useful for exempting release branches or other special refs.
                              items:
                                pattern: ^(~DEFAULT_BRANCH|~ALL|refs/(heads|tags)(/?[*a-zA-Z0-9][a-zA-Z0-9*_.-]*)*)$
                                type: string
                              maxItems: 50
                              type: array
                            include:
                              description: |-
                                Include defines ref patterns that the ruleset applies to.
                                Patterns can use wildcards (*) and must start with refs/heads/ (branches) or refs/tags/ (tags).
                                Use "~DEFAULT_BRANCH" to target the default branch.
                                Use "~ALL" to target all branches.
                                Examples: "refs/heads/main", "refs/heads/feature/*", "refs/tags/v*", "~DEFAULT_BRANCH", "~ALL"
                              items:
                                pattern: ^(~DEFAULT_BRANCH|~ALL|refs/(heads|tags)(/?[*a-zA-Z0-9][a-zA-Z0-9*_.-]*)*)$
                                type: string
                              maxItems: 50
                              minItems: 1
                              type: array
                          type: object
                        repositoryName:
                          description: |-
                            RepositoryName targets repositories for Organization-level rulesets by their name.
                            The field is ignored for Repository-level rulesets.
                          properties:
                            exclude:
                              description: Exclude defines repository name patterns
                                to exempt from the ruleset.
                              items:
                                type: string
                              maxItems: 50
                              type: array
                            include:
                              description: |-
                                Include defines repository name patterns that the ruleset applies to.
                                Use "~ALL" to target all repositories. Supports wildcards (*).
                                Examples: "~ALL", "my-repo-*", "backend-*"
                              items:
                                type: string
                              maxItems: 50
                              minItems: 1
                              type: array
                            protected:
                              default: false
                              description: Protected determines whether renaming a
                                targeted repository is prevented.
                              type: boolean
                          required:
                          - include
                          type: object
                        repositoryProperty:
                          description: |-
                            RepositoryProperty targets repositories for Organization-level rulesets by matching against custom properties.
                            The field is ignored for Repository-level rulesets.
                          properties:
                            exclude:
                              description: |-
                                Exclude defines repository property conditions that exempt repositories from the ruleset.
                                A repository matching any of the conditions is excluded from the rule.
                                The names of the properties in the slice are validated to be unique.
                              items:
                                description: |-
                                  RepositoryPropertyTarget defines a single repository property condition for ruleset targeting.
                                  The repository must have the specified property set to one of the given values.
                                properties:
                                  name:
                                    description: |-
                                      Name is the name of the repository custom property to match against.
                                      Must match a custom property defined at the organization level.
                                      Note: restrict name length to be able to validate within budget
                                    maxLength: 100
                                    minLength: 1
                                    type: string
                                  propertyValues:
                                    description: |-
                                      PropertyValues is the list of values to match against the custom property.
                                      The repository's property value must be one of these values for the condition to match.
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                  source:
                                    description: Source defines where the property
                                      is defined. Defaults to "custom" for organization-defined
                                      properties.
                                    type: string
                                required:
                                - name
                                - propertyValues
                                type: object
                              maxItems: 50
                              type: array
                              x-kubernetes-validations:
                              - message: property names must be unique
                                rule: self.all(x, self.filter(y, y.name == x.name).size()
                                  <= 1)
                            include:
                              description: |-
                                Include defines repository property conditions that must match for the ruleset to apply.
                                A repository must match all included property conditions. The names of the properties in the slice are
                                validated to be unique.
                              items:
                                description: |-
                                  RepositoryPropertyTarget defines a single repository property condition for ruleset targeting.
                                  The repository must have the specified property set to one of the given values.
                                properties:
                                  name:
                                    description: |-
                                      Name is the name of the repository custom property to match against.
                                      Must match a custom property defined at the organization level.
                                      Note: restrict name length to be able to validate within budget
                                    maxLength: 100
                                    minLength: 1
                                    type: string
                                  propertyValues:
                                    description: |-
                                      PropertyValues is the list of values to match against the custom property.
                                      The repository's property value must be one of these values for the condition to match.
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                  source:
                                    description: Source defines where the property
                                      is defined. Defaults to "custom" for organization-defined
                                      properties.
                                    type: string
                                required:
                                - name
                                - propertyValues
                                type: object
                              maxItems: 50
                              minItems: 1
                              type: array
                              x-kubernetes-validations:
                              - message: property names must be unique
                                rule: self.all(x, self.filter(y, y.name == x.name).size()
                                  <= 1)
                          required:
                          - include
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: at most one of the fields in [repositoryName repositoryProperty]
                          may be set
                        rule: (has(self.repositoryName)?1:0)+(has(self.repositoryProperty)?1:0)
                          <= 1
                    enforcement:
                      description: |-
                        Enforcement determines whether the ruleset is enforced.
                        - "disabled": Ruleset is not enforced
                        - "active": Ruleset is actively enforced; violations block operations
                        - "evaluate": Ruleset is evaluated but violations only generate warnings
                      enum:
                      - disabled
                      - active
                      - evaluate
                      type: string
                    name:
                      description: Name is the display name of the ruleset shown in
                        the GitHub UI.
                      maxLength: 255
                      minLength: 1
                      pattern: ^[a-zA-Z0-9][a-zA-Z0-9\s\[\]*/'_.,~-]*[a-zA-Z0-9\[\]]$
                      type: string
                    rules:
                      description: Rules defines the specific rules to enforce in
                        this ruleset.
                      properties:
                        branchNamePattern:
                          description: |-
                            BranchNamePattern enforces a pattern for branch names.
                            Use this to enforce branch naming conventions like "feature/*" or "hotfix/*".
                          properties:
                            negate:
                              default: false
                              description: |-
                                Negate inverts the pattern matching logic.
                                When true, the rule passes if the pattern does NOT match.
                                Example: Use with "contains" to prevent certain words in commit messages.
                              type: boolean
                            operator:
                              description: |-
                                Operator defines how the pattern is evaluated.
                                - "starts_with": String must start with the pattern
                                - "ends_with": String must end with the pattern
                                - "contains": String must contain the pattern
                                - "regex": String must match the pattern as a regular expression
