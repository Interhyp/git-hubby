---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: organizations.github.interhyp.de
spec:
  group: github.interhyp.de
  names:
    kind: Organization
    listKind: OrganizationList
    plural: organizations
    singular: organization
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Organization is the Schema for the organizations API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Organization
            properties:
              actionsSettings:
                description: |-
                  ActionsSettings configures GitHub Actions permissions and behavior for the organization.
                  This includes which repositories can use Actions, which actions are allowed, and runner group configurations.
                  See: https://docs.github.com/en/rest/actions/permissions
                properties:
                  allowedActions:
                    description: |-
                      AllowedActions configures which actions and workflows are allowed to run.
                      Must be nil if EnabledRepositories is "none".
                      - "all": All actions and reusable workflows are allowed
                      - "local_only": Only actions and workflows defined in the same repository or organization are allowed
                      - "selected": Only specific actions are allowed (requires SelectedAllowedActions)
                    enum:
                    - all
                    - local_only
                    - selected
                    type: string
                  artifactAndLogRetentionDays:
                    default: 400
                    description: |-
                      ArtifactAndLogRetentionDays specifies how many days workflow artifacts and logs are retained.
                      Must be between 1 and 400 days. Shorter retention periods reduce storage costs.
                    type: integer
                  canApprovePullRequestReviews:
                    default: false
                    description: |-
                      CanApprovePullRequestReviews determines whether the GITHUB_TOKEN can approve pull requests.
                      When false, prevents workflows from approving pull requests automatically.
                    type: boolean
                  defaultWorkflowPermissions:
                    default: read
                    description: |-
                      DefaultWorkflowPermissions sets the default GITHUB_TOKEN permissions for workflows.
                      - "read": Token has read-only access to repository contents
                      - "write": Token has read and write access to repository contents
                    enum:
                    - read
                    - write
                    type: string
                  enabledRepositories:
                    default: none
                    description: |-
                      EnabledRepositories determines which repositories can use GitHub Actions.
                      - "all": Actions enabled for all repositories
                      - "none": Actions disabled for all repositories
                      - "selected": Actions enabled for specific repositories (requires additional configuration)
                    enum:
                    - all
                    - none
                    - selected
                    type: string
                  runnerGroups:
                    description: |-
                      RunnerGroups configures self-hosted runner groups for the organization.
                      Each group can have different visibility and workflow restrictions.
                    items:
                      description: |-
                        RunnerGroup configures a self-hosted runner group for GitHub Actions in an organization.
                        Runner groups allow you to control which repositories can use specific sets of self-hosted runners.
                        See: https://docs.github.com/en/rest/actions/self-hosted-runner-groups
                      properties:
                        name:
                          description: Name is the unique name of the runner group
                            within the organization.
                          type: string
                        restrictedToWorkflows:
                          default: false
                          description: |-
                            RestrictedToWorkflows determines whether this runner group can only run specific workflows.
                            If true, only workflows listed in SelectedWorkflows can use runners in this group.
                            This provides additional security by limiting which workflows can execute on sensitive runners.
                          type: boolean
                        selectedWorkflows:
                          description: |-
                            SelectedWorkflows lists the workflows that can use runners in this group.
                            This field is only used when RestrictedToWorkflows is true.
                            Each entry must be a full workflow path with a reference (branch, tag, or SHA).
                            Example: "octo-org/octo-repo/.github/workflows/deploy.yaml@refs/heads/main"
                          items:
                            type: string
                          type: array
                        visibility:
                          default: all
                          description: |-
                            Visibility determines which repositories can access runners in this group.
                            - "all": All repositories in the organization can use these runners
                            - "private": Only private repositories can use these runners
                            - "selected": Only specific repositories can use these runners (selected via AvailableActionsRunnerGroups in RepositorySpec)
                          enum:
                          - all
                          - private
                          - selected
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  selectedAllowedActions:
                    description: |-
                      SelectedAllowedActions specifies which actions are allowed when AllowedActions is "selected".
                      This field is required when AllowedActions is "selected" and ignored otherwise.
                    properties:
                      githubOwnedAllowed:
                        default: false
                        description: |-
                          GitHubOwnedAllowed determines whether actions created by GitHub are allowed to run.
                          This includes actions in the "actions" and "github" organizations.
                        type: boolean
                      patternsAllowed:
                        default: []
                        description: |-
                          PatternsAllowed is a list of glob patterns specifying allowed actions.
                          Each pattern can match action repositories using wildcards, e.g., "my-org/*" or "*/action-name@*".
                        items:
                          type: string
                        type: array
                      verifiedAllowed:
                        default: false
                        description: |-
                          VerifiedAllowed determines whether actions from verified creators are allowed to run.
                          Verified creators are trusted partners and organizations with verified domains.
                        type: boolean
                    type: object
                  shaPinningRequired:
                    default: false
                    description: |-
                      ShaPinningRequired determines whether workflows must reference actions using the commit SHA instead of tags or branches.
                      When true, improves security by preventing tag manipulation attacks.
                    type: boolean
                type: object
              codeSecurityConfigurations:
                description: |-
                  CodeSecurityConfigurations lists code security configurations to create and optionally attach to repositories.
                  Each configuration defines security features like dependency scanning, secret scanning, and code scanning.
                  See: https://docs.github.com/en/rest/code-security/configurations
                items:
                  description: |-
                    AttachableCodeSecurityConfigurationRef references a CodeSecurityConfiguration CRD and specifies its attachment scope.
                    Code security configurations define security settings like dependency scanning, secret scanning, and code scanning.
                    See: https://docs.github.com/en/rest/code-security/configurations
                  properties:
                    attachmentScope:
                      description: |-
                        AttachmentScope defines which repositories the code security configuration applies to.
                        - "all": Apply to all repositories in the organization
                        - "all_without_configurations": Apply to repositories without an existing configuration
                        - "public": Apply only to public repositories
                        - "private_or_internal": Apply only to private and internal repositories
                        - "selected": Apply only to repositories that explicitly reference this configuration in their AttachedCodeSecurityConfiguration field
                        If not set, the configuration is created but not attached to any repositories.

                        Note: GitHub's API does not provide a way to retrieve the current attachment scope type.
                        The reconciler ensures functional correctness by comparing the actual list of attached repositories
                        to the desired state, not the scope label itself. This means GitHub's UI may display "selected repositories"
                        even when the scope is set to "all" (if all repositories happen to be selected), which is a cosmetic
                        discrepancy that does not affect the actual security configuration. The reconciler will only re-attach
                        if the actual repository attachments differ from what the scope implies.

                        For scope "all_without_configurations", the attachment is performed unconditionally without
                        comparing repository lists, as there is no reliable way to determine which repositories should
                        be included (repositories without configurations at the time of attachment may have since
                        been configured). The reconciler will re-attach on every reconciliation for this scope.
                      enum:
                      - all
                      - all_without_configurations
                      - public
                      - private_or_internal
                      - selected
                      type: string
                    name:
                      description: Name is the name of the referenced CodeSecurityConfiguration
                        CRD.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              customProperties:
                description: |-
                  CustomProperties defines custom metadata properties that can be assigned to repositories in the organization.
                  These properties allow you to categorize and add structured metadata to your repositories.
                  See: https://docs.github.com/en/rest/orgs/custom-properties
                items:
                  description: |-
                    OrgCustomProperty defines a custom property for an organization.
                    Custom properties allow you to add metadata to repositories in your organization.
                    This is a kubebuilder annotated copy of github.CustomProperty without the source_type (as it is fixed to "organization").
                    For the logic to work the json field names must match the ones in github.CustomProperty.
                    See: https://docs.github.com/en/rest/orgs/custom-properties
                  properties:
                    allowedValues:
                      description: |-
                        AllowedValues is a list of allowed values for the property.
                        This property is required for ValueType "single_select" and "multi_select".
                        For the other ValueTypes, it must be empty.
                      items:
                        type: string
                      maxItems: 200
                      type: array
                    defaultValue:
                      description: |-
                        DefaultValue is the default value for the property.
                        This property must be set if Required is true. It must be empty if Required is false.
                        The allowed format depends on the ValueType.
                        For ValueType "string" or "single_select", it must be a string. For "single_select", it must be one of the AllowedValues.
                        For ValueType "multi_select", it must be a JSON array of strings only containing elements of AllowedValues.
                        For ValueType "true_false", it must be a string that is either "true" or "false".
                      properties:
                        value:
                          description: |-
                            Value is the default value for properties with ValueType "string", "single_select", or "true_false".
                            For "true_false", it must be either "true" or "false".
                            For "single_select", it must be one of the AllowedValues defined in the property.
                          type: string
                        values:
                          description: |-
                            Values is the default value for properties with ValueType "multi_select".
                            Each value must be one of the AllowedValues defined in the property.
                          items:
                            type: string
                          type: array
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of the fields in [value values] must
                          be set
                        rule: (has(self.value)?1:0)+(has(self.values)?1:0) == 1
                    description:
                      description: Description provides additional information about
                        the purpose and usage of this custom property.
                      type: string
                    propertyName:
                      description: |-
                        PropertyName is the unique name of the custom property.
                        Must start with a letter, number, _, $, or # and can only contain letters, numbers, _, $, #, and -.
                      pattern: ^[a-zA-Z0-9_\$#\-]+$
                      type: string
                    required:
                      default: false
                      description: |-
                        Required indicates whether this property must be set on all repositories.
                        If true, a DefaultValue must be provided.
                      type: boolean
                    valueType:
                      description: |-
                        ValueType specifies the type of value this property accepts.
                        - "string": A free-form text value
                        - "single_select": A single value from a predefined list (requires AllowedValues)
                        - "multi_select": Multiple values from a predefined list (requires AllowedValues)
                        - "true_false": A boolean value represented as "true" or "false"
                      enum:
                      - string
                      - single_select
                      - multi_select
                      - true_false
                      type: string
                    valuesEditableBy:
                      default: org_actors
                      description: |-
                        ValuesEditableBy determines who can edit the property values on repositories.
                        - "org_actors": Only organization members can edit values
                        - "org_and_repo_actors": Both organization and repository members can edit values
                      enum:
                      - org_actors
                      - org_and_repo_actors
                      type: string
                  required:
                  - propertyName
                  - valueType
                  type: object
                maxItems: 100
                type: array
              description:
                description: |-
                  Description is a human-readable description of the organization.
                  This appears on the organization's GitHub profile page.
                type: string
              githubAppConfig:
                description: |-
                  GitHubAppConfig specifies the GitHub App installation and credentials secret to use for
                  authenticating API requests on behalf of this organization.
                  At least one of GitHubAppConfig or GitHubAppInstallationId must be set.
                  If both are set, GitHubAppConfig takes precedence.
                properties:
                  credentialsSecretName:
                    description: |-
                      CredentialsSecretName is the name of the Kubernetes Secret containing the GitHub App credentials.
                      The secret must contain the keys `app-id` and `private-key` and must reside in the namespace
                      configured via the APP_CREDENTIALS_SECRET_NAMESPACE environment variable.
                    minLength: 1
                    type: string
                  installationId:
                    description: |-
                      InstallationId is the numeric ID of the GitHub App installation for this organization.
                      You can find this ID in your GitHub App's installation settings or via the GitHub API.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - credentialsSecretName
                - installationId
                type: object
              githubAppInstallationId:
                description: |-
                  GitHubAppInstallationId is the numeric ID of the GitHub App installation for this organization.
                  This field is deprecated. Use GitHubAppConfig instead, which also allows specifying which
                  credential secret to use. When only this field is set, the operator falls back to the
                  secret name configured via --app-credentials-secret-name.
                  At least one of GitHubAppInstallationId or GitHubAppConfig must be set.
                  If both are set, GitHubAppConfig takes precedence.
                format: int64
                minimum: 1
                type: integer
              location:
                description: |-
                  Location is the organization's location (e.g., "Munich, Germany").
                  This appears on the organization's GitHub profile page.
                maxLength: 100
                type: string
              login:
                description: |-
                  Login is the GitHub organization login (the unique, immutable identifier on GitHub).
                  This field is optional for backwards compatibility. If not specified, the Name field
                  will be used as both login and display name.
                  It is recommended to explicitly set this field to clearly separate login from display name.
                maxLength: 39
                minLength: 1
                type: string
              memberPrivileges:
                description: |-
                  MemberPrivileges configures the privileges and default permissions for members of this organization.
                  Configurability may be restricted by Enterprise policies.
                properties:
                  defaultRepositoryPermission:
                    description: |-
                      DefaultRepositoryPermission defines the default permission level members have for organization repositories.
                      This setting can not be set if it is fixed at Enterprise level.
                    enum:
                    - read
                    - write
                    - admin
                    - none
                    type: string
                  membersCanCreateInternalRepositories:
                    description: |-
                      MembersCanCreateInternalRepositories defines whether organization members can create internal repositories,
                      which are visible to all enterprise members. You can only allow members to create internal repositories if
                      your organization is associated with an enterprise account using GitHub Enterprise Cloud or
                      GitHub Enterprise Server 2.20+.
                    type: boolean
                  membersCanCreatePages:
                    description: |-
                      MembersCanCreatePages defines whether organization members can create GitHub Pages sites.
                      Existing published sites will not be impacted.
                    type: boolean
                  membersCanCreatePrivatePages:
                    description: |-
                      MembersCanCreatePrivatePages defines whether organization members can create private GitHub Pages sites.
                      Existing published sites will not be impacted.
                    type: boolean
                  membersCanCreatePrivateRepositories:
                    description: |-
                      MembersCanCreatePrivateRepositories defines whether organization members can create private repositories,
                      which are visible to organization members with permission.
                    type: boolean
                  membersCanCreatePublicPages:
                    description: |-
                      MembersCanCreatePublicPages defines whether organization members can create public GitHub Pages sites.
                      Existing published sites will not be impacted.
                      This setting is not supported for Organizations in Enterprises with Managed Users (EMU).
                    type: boolean
                  membersCanCreatePublicRepositories:
                    description: |-
                      MembersCanCreatePublicRepositories defines whether organization members can create public repositories,
                      which are visible to anyone.
                      This setting is not supported for Organizations in Enterprises with Managed Users (EMU).
                    type: boolean
                  membersCanForkPrivateRepositories:
                    description: MembersCanForkPrivateRepositories defines whether
                      organization members can fork private organization repositories.
                    type: boolean
                type: object
              memberSuffix:
                default: ""
                description: |-
                  MemberSuffix defines a suffix appended to each team member username before matching/adding them on GitHub.
                  Useful when GitHub usernames follow a naming convention (e.g. enterprise suffix).
                  Is ignored if environment variable GITHUB_MEMBER_SUFFIX is set.
                maxLength: 100
                type: string
              name:
                description: |-
                  Name is the organization's display name shown on the GitHub profile.
                  If Login is not specified, this field will also be used as the organization login
                  for backwards compatibility.
                  At least one of Login or Name must be specified.
                maxLength: 255
                minLength: 1
                type: string
              plan:
                default: enterprise
                description: |-
                  Plan indicates the GitHub plan tier for this organization (enterprise, team, or free).
                  Determines whether Enterprise-only features (e.g., custom properties, runner groups) are reconciled or skipped.
                enum:
                - enterprise
                - team
                - free
                type: string
              rulesetPresets:
                description: |-
                  RulesetPresetList references RulesetPreset CRDs that define repository rulesets for this organization.
                  Rulesets enforce policies like branch protection, required reviews, and status checks.
                  See: https://docs.github.com/en/rest/orgs/rules
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              rulesets:
                description: |-
                  Rulesets defines organization rulesets inline, without the need for a separate RulesetPreset CRD.
                  Inline rulesets support exactly the same fields as a RulesetPreset.
                  The operator reconciles the union of inline rulesets and the rulesets referenced via RulesetPresetList.
                  If an inline ruleset and a referenced RulesetPreset (or two referenced RulesetPresets) share the same name,
                  identical definitions are applied once (a warning is logged), while differing definitions are treated as a
                  conflict: no rulesets are changed on GitHub and the RulesetsSynced condition is set to False.
                  At most 10 inline rulesets are allowed; larger or shared sets of rules belong in RulesetPresets.
                  The target 'repository' is supported for organization-level rulesets.
                items:
                  description: |-
                    RulesetSpec defines a ruleset. It is the spec of a RulesetPreset and the element type of inline rulesets
                    in Organization.spec.rulesets and Repository.spec.rulesets.
                    A ruleset preset defines reusable repository rules that can be applied to multiple repositories
                    or organizations. Rulesets enforce policies like branch protection, required reviews, and more.
                    A ruleset can extend a RulesetPreset via Extends; see docs/configuration/repository.md#extending-rulesets for the merge rules.
                    See: https://docs.github.com/en/rest/repos/rules
                  properties:
                    bypassActors:
                      description: |-
                        BypassActors defines actors (users, teams, apps) who can bypass this ruleset.
                        Bypass actors can perform operations that would otherwise be blocked by the ruleset.
                        See: https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets#about-bypass-mode-for-rulesets
                      items:
                        description: |-
                          RulesetBypassActor defines an actor (user, team, or integration) who can bypass ruleset enforcement.
                          Either ActorID (for direct specification) or ActorSlug (for name-based resolution) must be provided for
                          ActorTypes "Integration" and "Team". ActorID must be provided for ActorType "RepositoryRole".
                          Both must be empty for ActorType "DeployKey".
                          See: https://docs.github.com/en/rest/repos/rules#create-an-organization-repository-ruleset
                        properties:
                          actorId:
                            description: |-
                              ActorID is the numeric ID of the bypass actor.
                              This field is mutually exclusive with ActorSlug.
                            format: int64
                            type: integer
                          actorSlug:
                            description: |-
                              ActorSlug is the slug or name of the actor, which will be resolved to an ID.
                              This field is mutually exclusive with ActorID.
                              Only supported for ActorType "Integration" (GitHub Apps) and "Team" (organization teams).
                              For Integration, use the app slug (e.g., "my-github-app").
                              For Team, use the team slug (e.g., "platform-engineers").
                            type: string
                          actorType:
                            description: |-
                              ActorType specifies the type of actor that can bypass the ruleset.
                              - "Integration": A GitHub App
                              - "OrganizationAdmin": Organization administrators
                              - "RepositoryRole": Users with a specific repository role
                              - "Team": An organization team
                              - "DeployKey": A deploy key
                              - "EnterpriseOwner": Enterprise owners (GitHub Enterprise only)
                            enum:
                            - Integration
                            - OrganizationAdmin
                            - RepositoryRole
                            - Team
                            - DeployKey
                            - EnterpriseOwner
                            type: string
                          bypassMode:
                            description: |-
                              BypassMode determines when and how the actor can bypass the ruleset.
                              - "always": Actor can always bypass the ruleset
                              - "pull_request": Actor can bypass only when submitting via pull request
                            enum:
                            - always
                            - pull_request
                            type: string
                        required:
                        - actorType
                        type: object
                        x-kubernetes-validations:
                        - message: at most one of the fields in [actorId actorSlug]
                            may be set
                          rule: (has(self.actorId)?1:0)+(has(self.actorSlug)?1:0)
                            <= 1
                      maxItems: 100
                      type: array
                    conditions:
                      description: |-
                        Conditions defines which refs are included or excluded in the list of targets for this Ruleset.
                        They also define which Repositories are targeted by Organization-level Rulesets.
                      properties:
                        refName:
                          description: RefName defines which git refs (branches or
                            tags) a ruleset applies to.
                          minProperties: 1
                          properties:
                            exclude:
                              description: |-
                                Exclude defines ref patterns to exempt from the ruleset.
                                Refs matching exclude patterns will not be subject to the ruleset rules.
                                Useful for exempting release branches or other special refs.
                              items:
                                pattern: ^(~DEFAULT_BRANCH|~ALL|refs/(heads|tags)(/?[*a-zA-Z0-9][a-zA-Z0-9*_.-]*)*)$
                                type: string
                              maxItems: 50
                              type: array
                            include:
                              description: |-
                                Include defines ref patterns that the ruleset applies to.
                                Patterns can use wildcards (*) and must start with refs/heads/ (branches) or refs/tags/ (tags).
                                Use "~DEFAULT_BRANCH" to target the default branch.
                                Use "~ALL" to target all branches.
                                Examples: "refs/heads/main", "refs/heads/feature/*", "refs/tags/v*", "~DEFAULT_BRANCH", "~ALL"
                              items:
                                pattern: ^(~DEFAULT_BRANCH|~ALL|refs/(heads|tags)(/?[*a-zA-Z0-9][a-zA-Z0-9*_.-]*)*)$
                                type: string
                              maxItems: 50
                              minItems: 1
                              type: array
                          type: object
                        repositoryName:
                          description: |-
                            RepositoryName targets repositories for Organization-level rulesets by their name.
                            The field is ignored for Repository-level rulesets.
                          properties:
                            exclude:
                              description: Exclude defines repository name patterns
                                to exempt from the ruleset.
                              items:
                                type: string
                              maxItems: 50
                              type: array
                            include:
                              description: |-
                                Include defines repository name patterns that the ruleset applies to.
                                Use "~ALL" to target all repositories. Supports wildcards (*).
                                Examples: "~ALL", "my-repo-*", "backend-*"
                              items:
                                type: string
                              maxItems: 50
                              minItems: 1
                              type: array
                            protected:
                              default: false
                              description: Protected determines whether renaming a
                                targeted repository is prevented.
                              type: boolean
                          required:
                          - include
                          type: object
                        repositoryProperty:
                          description: |-
                            RepositoryProperty targets repositories for Organization-level rulesets by matching against custom properties.
                            The field is ignored for Repository-level rulesets.
                          properties:
                            exclude:
                              description: |-
                                Exclude defines repository property conditions that exempt repositories from the ruleset.
                                A repository matching any of the conditions is excluded from the rule.
                                The names of the properties in the slice are validated to be unique.
                              items:
                                description: |-
                                  RepositoryPropertyTarget defines a single repository property condition for ruleset targeting.
                                  The repository must have the specified property set to one of the given values.
                                properties:
                                  name:
                                    description: |-
                                      Name is the name of the repository custom property to match against.
                                      Must match a custom property defined at the organization level.
                                      Note: restrict name length to be able to validate within budget
                                    maxLength: 100
                                    minLength: 1
                                    type: string
                                  propertyValues:
                                    description: |-
                                      PropertyValues is the list of values to match against the custom property.
                                      The repository's property value must be one of these values for the condition to match.
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                  source:
                                    description: Source defines where the property
                                      is defined. Defaults to "custom" for organization-defined
                                      properties.
                                    type: string
                                required:
                                - name
                                - propertyValues
                                type: object
                              maxItems: 50
                              type: array
                              x-kubernetes-validations:
                              - message: property names must be unique
                                rule: self.all(x, self.filter(y, y.name == x.name).size()
                                  <= 1)
                            include:
                              description: |-
                                Include defines repository property conditions that must match for the ruleset to apply.
                                A repository must match all included property conditions. The names of the properties in the slice are
                                validated to be unique.
                              items:
                                description: |-
                                  RepositoryPropertyTarget defines a single repository property condition for ruleset targeting.
                                  The repository must have the specified property set to one of the given values.
                                properties:
                                  name:
                                    description: |-
                                      Name is the name of the repository custom property to match against.
                                      Must match a custom property defined at the organization level.
                                      Note: restrict name length to be able to validate within budget
                                    maxLength: 100
                                    minLength: 1
                                    type: string
                                  propertyValues:
                                    description: |-
                                      PropertyValues is the list of values to match against the custom property.
                                      The repository's property value must be one of these values for the condition to match.
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                  source:
                                    description: Source defines where the property
                                      is defined. Defaults to "custom" for organization-defined
                                      properties.
                                    type: string
                                required:
                                - name
                                - propertyValues
                                type: object
                              maxItems: 50
                              minItems: 1
                              type: array
                              x-kubernetes-validations:
                              - message: property names must be unique
                                rule: self.all(x, self.filter(y, y.name == x.name).size()
                                  <= 1)
                          required:
