apiVersion: github.interhyp.de/v1alpha1
kind: Organization
metadata:
  labels:
    app.kubernetes.io/name: git-hubby
    app.kubernetes.io/managed-by: kustomize
  name: sample-org
spec:
  login: sample-org
  name: "Sample Organization"
  description: "GitHub Sample Organization"
  location: "Munich, Germany"
  website: "https://example.com"
  githubAppCredentials:
    secretRef:
      name: sample-org-app-credentials
  # Inline rulesets are reconciled together with the rulesets referenced via rulesetPresets (max. 10 items).
  rulesets:
    - name: protect-default-branch
      target: branch
      enforcement: active
      conditions:
        refName:
          include: ["~DEFAULT_BRANCH"]
      rules:
        deletion: true
        nonFastForward: true
