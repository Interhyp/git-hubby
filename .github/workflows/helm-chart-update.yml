name: Update Helm Chart Releases and Snapshots

on:
  workflow_run:
    workflows: ["Build & Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      source:
        description: Chart update source
        type: choice
        options:
          - branch
          - external-snapshot
        default: branch
        required: true
      build_run_id:
        description: External snapshot build run ID from the publisher summary
        type: string
        required: false
      publication_artifact_id:
        description: Publication artifact ID from the publisher summary
        type: string
        required: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HELM_REPO: Interhyp/git-hubby-helm
  CHART_DIR: helm-chart

jobs:
  update-helm-chart:
    name: Update Helm Chart CRDs and appVersion
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'branch') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Determine source branch
        id: source
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.branch }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Determine image version
        id: version
        run: |
          if [[ "${{ steps.source.outputs.branch }}" == "main" ]]; then
            git fetch --tags
            LATEST_TAG=$(git tag --sort=-v:refname | head -1)
            if [[ -n "$LATEST_TAG" ]]; then
              VERSION="${LATEST_TAG#v}"
            else
              SHORT_SHA="$(git rev-parse --short HEAD)"
              VERSION="main-${SHORT_SHA}"
            fi
          else
            BRANCH="$(echo '${{ steps.source.outputs.branch }}' | sed 's|[^a-zA-Z0-9._-]|-|g' | cut -c1-50)"
            SHORT_SHA="$(git rev-parse --short ${{ steps.source.outputs.sha }})"
            VERSION="snapshot-${BRANCH}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${VERSION}"

      - name: Generate CRDs
        run: make manifests

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.HELM_APP_ID }}
          private-key: ${{ secrets.HELM_APP_PRIVATE_KEY }}
          owner: Interhyp
          repositories: git-hubby-helm

      - name: Checkout Helm chart repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HELM_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: ${{ env.CHART_DIR }}

      - name: Determine target branch
        id: branch
        run: |
          if [[ "${{ steps.source.outputs.branch }}" == "main" ]]; then
            echo "name=auto-update/v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=auto-update/${{ steps.source.outputs.branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout or create target branch
        working-directory: ${{ env.CHART_DIR }}
        run: |
          git fetch origin "${{ steps.branch.outputs.name }}" 2>/dev/null && \
            git checkout "${{ steps.branch.outputs.name }}" || \
            git checkout -b "${{ steps.branch.outputs.name }}"

      - name: Update CRDs in Helm chart
        run: cp config/crd/bases/*.yaml ${{ env.CHART_DIR }}/crds/

      - name: Update appVersion in Helm chart
        run: |
          if [[ -f ${{ env.CHART_DIR }}/Chart.yaml ]]; then
            sed -i "s|^appVersion:.*|appVersion: \"${{ steps.version.outputs.version }}\"|" ${{ env.CHART_DIR }}/Chart.yaml
          fi

      - name: Determine commit type from version change
        id: commit-type
        run: |
          # Extract current appVersion from the chart (before update was applied above — read from git)
          CURRENT_VERSION=$(cd ${{ env.CHART_DIR }} && git show HEAD:Chart.yaml 2>/dev/null | grep "^appVersion:" | sed 's/^appVersion: *"\?//;s/"\? *$//' || echo "")
          NEW_VERSION="${{ steps.version.outputs.version }}"
          SOURCE_REPO="https://github.com/${{ github.repository }}"

          # Helper: extract semver triple (MAJOR.MINOR.PATCH) from a version string, returns "" if not semver
          semver() { echo "$1" | grep -oP '^\d+\.\d+\.\d+' || true; }

          CURRENT_SV=$(semver "$CURRENT_VERSION")
          NEW_SV=$(semver "$NEW_VERSION")

          if [[ -z "$CURRENT_SV" || -z "$NEW_SV" ]]; then
            # Non-semver (e.g. snapshot builds) — use chore, link to the commit
            COMMIT_TYPE="chore"
            COMPARE_URL="${SOURCE_REPO}/commit/${{ steps.source.outputs.sha }}"
          else
            CURRENT_MAJOR=$(echo "$CURRENT_SV" | cut -d. -f1)
            CURRENT_MINOR=$(echo "$CURRENT_SV" | cut -d. -f2)
            NEW_MAJOR=$(echo "$NEW_SV" | cut -d. -f1)
            NEW_MINOR=$(echo "$NEW_SV" | cut -d. -f2)

            if (( NEW_MAJOR > CURRENT_MAJOR )); then
              COMMIT_TYPE="feat!"
            elif (( NEW_MINOR > CURRENT_MINOR )); then
              COMMIT_TYPE="feat"
            else
              COMMIT_TYPE="fix"
            fi

            COMPARE_URL="${SOURCE_REPO}/compare/v${CURRENT_SV}...v${NEW_SV}"
          fi

          echo "type=${COMMIT_TYPE}" >> "$GITHUB_OUTPUT"
          echo "compare_url=${COMPARE_URL}" >> "$GITHUB_OUTPUT"
          echo "Detected commit type: ${COMMIT_TYPE} (${CURRENT_VERSION} → ${NEW_VERSION})"
          echo "Compare URL: ${COMPARE_URL}"

      - name: Commit and push changes
        id: commit
        working-directory: ${{ env.CHART_DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "${{ steps.commit-type.outputs.type }}: update CRDs and appVersion to version ${{ steps.version.outputs.version }}" \
            -m "${{ steps.commit-type.outputs.compare_url }}"
          git push origin "${{ steps.branch.outputs.name }}"
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request for main branch
        if: steps.source.outputs.branch == 'main' && steps.commit.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd ${{ env.CHART_DIR }}
          # Ensure the label exists
          gh label create "automatic-update" --description "Automated updates" --color "0E8A16" --repo "${{ env.HELM_REPO }}" 2>/dev/null || true
          PR_BODY="Automated CRD and appVersion update from [git-hubby release v${{ steps.version.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})"$'\n\n'"**Changelog diff:** ${{ steps.commit-type.outputs.compare_url }}"
          EXISTING_PR=$(gh pr list --head "${{ steps.branch.outputs.name }}" --json number --jq '.[0].number' 2>/dev/null || true)
          if [[ -n "$EXISTING_PR" ]]; then
            echo "PR #${EXISTING_PR} already exists, updating..."
            gh pr edit "$EXISTING_PR" \
              --title "${{ steps.commit-type.outputs.type }}: update CRDs and appVersion to v${{ steps.version.outputs.version }}" \
              --body "$PR_BODY"
          else
            gh pr create \
              --repo "${{ env.HELM_REPO }}" \
              --head "${{ steps.branch.outputs.name }}" \
              --base main \
              --title "${{ steps.commit-type.outputs.type }}: update CRDs and appVersion to v${{ steps.version.outputs.version }}" \
              --body "$PR_BODY" \
              --label "automatic-update"
          fi

  external-snapshot:
    name: Create chart branch for external snapshot
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source == 'external-snapshot' && github.repository == 'Interhyp/git-hubby' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Validate requested run and artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          ARTIFACT_ID: ${{ inputs.publication_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,18}$ && "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,18}$ ]] || {
            echo 'Enter the run and publisher artifact IDs from the build summary' >&2; exit 1;
          }
          artifact="$(gh api "repos/Interhyp/git-hubby/actions/artifacts/$ARTIFACT_ID")"
          jq -e --arg run "$RUN_ID" '
            (.workflow_run.id | tostring) == $run and .expired == false and
            (.name | test("^pr-snapshot-publication-[1-9][0-9]*$"))
          ' <<< "$artifact" >/dev/null || { echo 'Artifact does not belong to the requested run' >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(jq -r .name <<< "$artifact")" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Download publisher artifact by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/publication

      - name: Validate published record, build attempt and PR
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          # The trusted parser validates every field before emitting step outputs.
          record="$(python3 trusted/.github/scripts/pr_snapshot.py validate-publication "$RUNNER_TEMP/publication" "$RUN_ID")"
          attempt="$(sed -n 's/^attempt=//p' <<< "$record")"
          pr="$(sed -n 's/^pr=//p' <<< "$record")"
          sha="$(sed -n 's/^sha=//p' <<< "$record")"
          [[ "$ARTIFACT_NAME" == "pr-snapshot-publication-$attempt" ]] || exit 1
          workflow_id="$(gh api repos/Interhyp/git-hubby/actions/workflows/pr-snapshot.yml --jq .id)"
          gh api "repos/Interhyp/git-hubby/actions/runs/$RUN_ID/attempts/$attempt" | jq -e --arg id "$workflow_id" '
            (.workflow_id | tostring) == $id and .event == "workflow_dispatch" and
            .head_branch == "main" and .status == "completed" and .conclusion == "success"
          ' >/dev/null || { echo 'Not a successful trusted external snapshot build' >&2; exit 1; }
          gh api "repos/Interhyp/git-hubby/pulls/$pr" | jq -e --arg sha "$sha" '
            .state == "open" and .head.repo != null and .head.repo.fork == true and .head.sha == $sha
          ' >/dev/null || { echo 'PR changed or closed; build and approve a new snapshot' >&2; exit 1; }
          printf '%s\n' "$record" >> "$GITHUB_OUTPUT"

      - name: Install image inspection tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Verify published image digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.publication.outputs.image_tag }}
          EXPECTED_DIGEST: ${{ steps.publication.outputs.image_digest }}
        run: |
          set -euo pipefail
          authfile="$RUNNER_TEMP/registry-auth.json"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$authfile" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          actual="$(skopeo inspect --authfile "$authfile" --format '{{.Digest}}' "docker://ghcr.io/interhyp/git-hubby:$IMAGE_TAG")"
          [[ "$actual" == "$EXPECTED_DIGEST" ]] || { echo 'Image tag no longer matches the approved digest' >&2; exit 1; }

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.HELM_APP_ID }}
          private-key: ${{ secrets.HELM_APP_PRIVATE_KEY }}
          owner: Interhyp
          repositories: git-hubby-helm

      - name: Checkout trusted Helm chart main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Interhyp/git-hubby-helm
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: helm-chart

      - name: Create and push snapshot branch
        env:
          PR: ${{ steps.publication.outputs.pr }}
          SHA: ${{ steps.publication.outputs.sha }}
          IMAGE_TAG: ${{ steps.publication.outputs.image_tag }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/Interhyp/git-hubby/pulls/$PR" | jq -e --arg sha "$SHA" '
            .state == "open" and .head.repo != null and .head.repo.fork == true and .head.sha == $sha
          ' >/dev/null || { echo 'PR changed or closed; build and approve a new snapshot' >&2; exit 1; }
          branch="auto-update/external-pr-${PR}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C helm-chart switch -c "$branch"
          python3 trusted/.github/scripts/pr_snapshot.py update-chart "$RUNNER_TEMP/publication" helm-chart "$SOURCE_RUN_ID"
          git -C helm-chart config user.name 'github-actions[bot]'
          git -C helm-chart config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C helm-chart add -A -- Chart.yaml crds/
          git -C helm-chart diff --cached --quiet && { echo 'No chart changes to publish' >&2; exit 1; }
          git -C helm-chart commit -m "chore: update chart for external PR $PR snapshot" \
            -m "https://github.com/Interhyp/git-hubby/pull/$PR/commits/$SHA"
          git -C helm-chart push origin "$branch"
          {
            echo '## Chart snapshot branch created'
            echo "PR: https://github.com/Interhyp/git-hubby/pull/$PR"
            echo "Source commit: \`$SHA\`"
            echo "Image tag: \`$IMAGE_TAG\`"
            echo "Chart branch: https://github.com/Interhyp/git-hubby-helm/tree/$branch"
            echo 'The git-hubby-helm Release workflow will publish the snapshot chart.'
          } >> "$GITHUB_STEP_SUMMARY"
